name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'
        
    - run: npm ci
    
    - name: Run ESLint
      run: npm run lint
      
    - name: Build Next.js
      run: npm run build
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
        
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'
    - run: npm ci
    # We will uncomment test scripts once testing tools are set up
    # - run: npm test
